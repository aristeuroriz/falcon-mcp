name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Do not set registry-url — it injects NODE_AUTH_TOKEN and breaks OIDC.
          cache: pnpm

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: |
          pnpm test
          pnpm test:mcp-config
          pnpm test:check-changeset

      - name: Prepare OIDC publish (no token auth)
        run: |
          unset NODE_AUTH_TOKEN || true
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          for f in "$HOME/.npmrc" .npmrc "$NPM_CONFIG_USERCONFIG"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              sed -i '/_authToken=/d' "$f"
              sed -i '/^always-auth=/d' "$f"
            fi
          done

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: node scripts/ci-publish.mjs
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""
