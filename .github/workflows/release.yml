name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: |
          pnpm test
          pnpm test:mcp-config
          pnpm test:check-changeset

      - name: Strip registry auth token for OIDC publish
        run: |
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken=/d' "$HOME/.npmrc"
            sed -i '/^always-auth=/d' "$HOME/.npmrc"
          fi
          if [ -f .npmrc ]; then
            sed -i '/_authToken=/d' .npmrc
            sed -i '/^always-auth=/d' .npmrc
          fi
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken=/d' "$NPM_CONFIG_USERCONFIG"
            sed -i '/^always-auth=/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          # Use npm publish (not pnpm) so --git-checks is not forwarded to npm 11+.
          # OIDC Trusted Publishing requires a recent npm (installed above).
          publish: npm publish packages/mcp-katex-validator --access public
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
